      - { anchor: { type: position, x: -8.66, y: -5.0 }, direction: { type: none }, shape: { type: circle, radius: 8 }, resolveDelay: 10000, telegraphBefore: 6000, hitEffectDuration: 500, effects: [{ type: damage, potency: 2000 }] }
      - { anchor: { type: position, x: 0.0, y: -10.0 }, direction: { type: none }, shape: { type: circle, radius: 8 }, resolveDelay: 11000, telegraphBefore: 6000, hitEffectDuration: 500, effects: [{ type: damage, potency: 2000 }] }
      - { anchor: { type: position, x: 0, y: 0 }, direction: { type: none }, shape: { type: circle, radius: 8 }, resolveDelay: 12000, telegraphBefore: 6000, hitEffectDuration: 500, effects: [{ type: damage, potency: 2000 }] }
