      - { anchor: { type: position, x: 9, y: 0 }, direction: { type: none }, shape: { type: circle, radius: 6.5 }, resolveDelay: 6000, telegraphBefore: 6000, hitEffectDuration: 500, effects: [{ type: damage, potency: 2000 }] }
      - { anchor: { type: position, x: 9, y: 9 }, direction: { type: none }, shape: { type: circle, radius: 6.5 }, resolveDelay: 6000, telegraphBefore: 6000, hitEffectDuration: 500, effects: [{ type: damage, potency: 2000 }] }

  # --- 泰坦的核心阶段 ---
  titan_shield:
    name: 大地之心
    type: ability
    targetType: single
    effects: [{ type: apply_buff, buffId: titan_invuln, target: caster }]
  titan_unshield:
