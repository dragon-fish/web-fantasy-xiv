    name: 爆炸
    type: ability
    targetType: aoe
    zones:
      - { anchor: { type: position, x: -9, y: -9 }, direction: { type: none }, shape: { type: circle, radius: 6.5 }, resolveDelay: 6000, telegraphBefore: 6000, hitEffectDuration: 500, effects: [{ type: damage, potency: 2000 }] }
