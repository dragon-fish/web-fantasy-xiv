phases:
  # ===== P1（100–80%）=====
  phase_default:
    hpFloor: 80
    actions:
      - { at: 0, action: enable_ai }
      - { at: 3000, use: rock_buster }
      - { at: 9000, use: landslide }
      - { at: 15000, use: tumult }
      - { at: 22000, use: rock_buster }
      - { at: 28000, use: landslide }
      - { at: 34000, use: tumult }
      - { at: 41000, loop: 3000 }

  # ===== P2（80–60%）=====
  p2:
    name: P2
    trigger: { on_hp_below: { group: boss, percent: 80 } }
    exclusive: true
    hpFloor: 60
    actions:
      - { at: 0, action: disable_ai }
      - { at: 0, action: teleport, position: { x: 0, y: 0 } }
      - { at: 300, use: geocrush_transition }
      - { at: 3500, action: enable_ai }
      - { at: 8000, use: weight_of_land }
      - { at: 14000, use: rock_buster }
      - { at: 19000, use: landslide }
      - { at: 25000, use: tumult }
      - { at: 32000, use: geocrush }
      - { at: 39000, use: weight_of_land }
      - { at: 45000, use: rock_buster }
      - { at: 50000, use: landslide }
      - { at: 56000, use: tumult }
      - { at: 63000, loop: 8000 }

  # ===== P3（60–40%）=====
  p3:
    name: P3
    trigger: { on_hp_below: { group: boss, percent: 60 } }
    exclusive: true
    hpFloor: 40
    actions:
      - { at: 2000, use: landslide }
      - { at: 7000, use: weight_of_land }
      # 九连桶·环形：顺/逆时针，或中间先炸（12s 才炸完）
      - at: 13000
        choose:
          - [{ use: bury_clock_cw, entity: helper }]
          - [{ use: bury_clock_ccw, entity: helper }]
          - [{ use: bury_clock_cw_rev, entity: helper }]
          - [{ use: bury_clock_ccw_rev, entity: helper }]
      - { at: 27000, use: rock_buster }
      - { at: 32000, use: rock_throw_single }
      - { at: 37000, use: landslide }
      - { at: 43000, use: weight_of_land }
      - { at: 49000, use: rock_buster }
      - { at: 54000, use: tumult }
      # 九连桶·正斜：正点先 / 斜点和中间先
      - at: 61000
        choose:
          - [{ use: bury_cross_cardinal, entity: helper }]
          - [{ use: bury_cross_diagonal, entity: helper }]
      - { at: 71000, use: landslide }
      - { at: 77000, use: geocrush }
      - { at: 84000, loop: 2000 }

  # ===== P4 心核（30s DPS 检测）=====
  p4:
    name: 泰坦的核心
    trigger: { on_hp_below: { group: boss, percent: 40 } }
    exclusive: true
    hpFloor: 40
    actions:
      - { at: 0, action: disable_ai }
      - { at: 0, use: titan_shield }
      - { at: 0, action: set_targetable, value: false }
      - { at: 500, action: set_visible, entity: heart, value: true }
      - { at: 1000, action: set_targetable, entity: heart, value: true }
      - { at: 3000, use: tumult }
      - { at: 18000, use: tumult }
      - { at: 30000, use: earthen_fury_fail }

  # ===== P5（40–0%）=====
  p5:
    name: P5
    trigger: { on_all_killed: { group: heart } }
    exclusive: true
    actions:
      - { at: 0, use: earthen_fury }
      - { at: 3000, use: titan_unshield }
      - { at: 3000, action: set_targetable, value: true }
      - { at: 3500, action: enable_ai }
      - { at: 7000, use: mountain_buster }
      - { at: 12000, use: tumult_four }
      # 三穿一：三排依次落下（落下顺序即爆炸顺序）
      - at: 20000
        choose:
          - [{ use: row_w, entity: helper }, { after: 1500, use: row_c, entity: helper }, { after: 3000, use: row_e, entity: helper }]
          - [{ use: row_e, entity: helper }, { after: 1500, use: row_c, entity: helper }, { after: 3000, use: row_w, entity: helper }]
          - [{ use: row_c, entity: helper }, { after: 1500, use: row_w, entity: helper }, { after: 3000, use: row_e, entity: helper }]
          - [{ use: row_c, entity: helper }, { after: 1500, use: row_e, entity: helper }, { after: 3000, use: row_w, entity: helper }]
          - [{ use: row_w, entity: helper }, { after: 1500, use: row_e, entity: helper }, { after: 3000, use: row_c, entity: helper }]
          - [{ use: row_e, entity: helper }, { after: 1500, use: row_w, entity: helper }, { after: 3000, use: row_c, entity: helper }]
      - { at: 31000, use: landslide }
      - { at: 36000, use: weight_of_land }
      - { at: 42000, use: rock_throw_single }
      - { at: 47000, use: mountain_buster }
      - { at: 52000, use: landslide }
      - at: 58000
        choose:
          - [{ use: bury_clock_cw, entity: helper }]
          - [{ use: bury_clock_ccw, entity: helper }]
          - [{ use: bury_clock_cw_rev, entity: helper }]
          - [{ use: bury_clock_ccw_rev, entity: helper }]
      - { at: 72000, use: tumult_four }
      - { at: 79000, use: weight_of_land }
      - { at: 84000, use: mountain_buster }
      - { at: 89000, use: geocrush }
      - { at: 96000, loop: 7000 }

  # ===== 软狂暴：开怪 6:30 =====
  enrage:
    trigger: on_combat_start
    background: true
    actions:
      - { at: 390000, use: upheaval_enrage }
      - { at: 400000, loop: 390000 }
