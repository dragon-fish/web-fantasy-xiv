phases:
  phase_default:
    actions:
      # ===== P1（教学） =====
      - { at: 0, action: enable_ai }
      - { at: 6000, use: screams_tutorial }

      # 猛进：朱雀离场，从场边随机一处出现并横穿全场；同时玩家头顶分散圈
      - { at: 11000, action: disable_ai }
      - { at: 11000, action: set_visible, value: false }
      - { at: 11000, action: set_targetable, value: false }
      - at: 11500
        choose:
          - [{ action: teleport, position: { x: -20, y: 0 } }, { action: lock_facing, facing: 90 }]
          - [{ action: teleport, position: { x: 20, y: 0 } }, { action: lock_facing, facing: 270 }]
          - [{ action: teleport, position: { x: 0, y: 20 } }, { action: lock_facing, facing: 180 }]
          - [{ action: teleport, position: { x: 0, y: -20 } }, { action: lock_facing, facing: 0 }]
      - { at: 12500, action: set_visible, value: true }
      - { at: 12600, use: rout_tutorial }
      - { at: 13500, use: rekindle, entity: helper }
      - { at: 11000, action: show_dialog, text: 猛进：朱雀会从场边冲锋横穿全场，避开那条直线。头顶的分散圈结算时，圈里不要有场地中央的火焰鸟尸体——碰到会把它复活。 }
      - { at: 18500, action: hide_dialog }
      - { at: 18500, action: set_visible, value: false }
      - { at: 19000, action: teleport, position: { x: 0, y: 6 } }
      - { at: 19800, action: set_visible, value: true }
      - { at: 19800, action: set_targetable, value: true }
      - { at: 20000, action: enable_ai }

      - { at: 24000, use: fleeting_summer_tutorial }
      - { at: 23500, action: show_dialog, text: 翼宿击：朝你释放的 90° 扇形，绕到侧面即可。 }
      - { at: 28500, action: hide_dialog }

      # 鬼宿脚：死刑（坦克开减伤 / DPS 拼刀）→ 前方半场刀
      - { at: 32000, use: phantom_flurry }
      - { at: 32000, mechanic: blade_clash, when: { role: dps }, params: { windup: 5000, skillName: 鬼宿脚, goodPotency: 1900, missPotency: 7500, justBuff: keen_eye, missBuff: opening } }
      - { at: 37500, use: phantom_half_tutorial }
      - { at: 32000, action: show_dialog, when: { role: tank }, text: 鬼宿脚：坦克死刑！读条结束前开启减伤。随后朱雀会朝正面劈出半场刀，立刻绕到它身后。 }
      - { at: 32000, action: show_dialog, when: { role: dps }, text: 鬼宿脚：拼刀！屏幕中央的光圈转满时按 空格 接刀，越准收益越高。随后朱雀会朝正面劈出半场刀，立刻绕到它身后。 }
      - { at: 43500, action: hide_dialog }

      # ===== 小怪战 =====
      - { at: 46000, use: screams }
      - { at: 51000, action: disable_ai }
      - { at: 51000, action: teleport, position: { x: 0, y: 6 } }
      - { at: 51500, use: phoenix_down }
      - { at: 51500, action: show_dialog, text: 苏生之羽：羽毛读条结束会复活范围内的火焰鸟尸体，尽快击破羽毛！复活的火焰鸟 15 秒后会放出高伤全场攻击。 }
      - at: 54500
        choose:
          - # 正点
            - { action: teleport, entity: feather_1, position: { x: 0, y: 11 } }
            - { action: teleport, entity: feather_2, position: { x: 11, y: 0 } }
            - { action: teleport, entity: feather_3, position: { x: 0, y: -11 } }
            - { action: teleport, entity: feather_4, position: { x: -11, y: 0 } }
          - # 斜点
            - { action: teleport, entity: feather_1, position: { x: 7.8, y: 7.8 } }
            - { action: teleport, entity: feather_2, position: { x: 7.8, y: -7.8 } }
            - { action: teleport, entity: feather_3, position: { x: -7.8, y: -7.8 } }
            - { action: teleport, entity: feather_4, position: { x: -7.8, y: 7.8 } }
      - { at: 55000, action: set_visible, entity: feather_1, value: true }
      - { at: 55000, action: set_visible, entity: feather_2, value: true }
      - { at: 55000, action: set_visible, entity: feather_3, value: true }
