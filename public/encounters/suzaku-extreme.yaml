# 朱雀诗魂战（极） — 浓缩单人版
# 设计：docs/superpowers/specs/2026-10-08-suzaku-extreme-design.md
# 时间轴参照 cactbot ui/raidboss/data/04-sb/trial/suzaku-ex.txt
# 数值：boss attack = 1，potency 即固定伤害。可回避机制常规 3800，教学 2300；全屏 1800，教学 1100。

# 练习友好复活：衰弱 → 濒死 → 结束（game/player-revive.ts）
revive: true

arena:
  name: 红莲狱火
  shape: circle
  radius: 20
  boundary: wall
  theme: wind

entities:
  boss:
    type: boss
    model: dragon
    group: boss
    hp: 400000
    attack: 1
    speed: 5
    # 大判定圈（FF14 原版朱雀同样巨大）：P2 悬停在中心洞上空时，近战从洞边仍能打到
    size: 4.5
    facing: 180
    position: { x: 0, y: 6, z: 0 }
    autoAttackRange: 5
    aggroRange: 10
  # 不可见的施法辅助（FF14 的 helper actor），用于与本体并行的点名技能
  helper:
    type: mob
    group: helper
    hp: 1
    attack: 1
    size: 0.1
    visible: false
    targetable: false
    position: { x: 0, y: 0, z: 0 }
  # 场地中央的火焰鸟尸体：被羽毛的苏生神通力或玩家的苏生之炎碰到会复活
  bird_1: { type: mob, model: firebird, group: scarlet_lady, hp: 6000, attack: 1, speed: 4, size: 0.8, dormant: true, targetable: false, position: { x: 3, y: 3, z: 0 }, facing: 45, onRevive: { use: ashes_to_ashes, after: 15000 } }
  bird_2: { type: mob, model: firebird, group: scarlet_lady, hp: 6000, attack: 1, speed: 4, size: 0.8, dormant: true, targetable: false, position: { x: 3, y: -3, z: 0 }, facing: 135, onRevive: { use: ashes_to_ashes, after: 15000 } }
  bird_3: { type: mob, model: firebird, group: scarlet_lady, hp: 6000, attack: 1, speed: 4, size: 0.8, dormant: true, targetable: false, position: { x: -3, y: -3, z: 0 }, facing: 225, onRevive: { use: ashes_to_ashes, after: 15000 } }
  bird_4: { type: mob, model: firebird, group: scarlet_lady, hp: 6000, attack: 1, speed: 4, size: 0.8, dormant: true, targetable: false, position: { x: -3, y: 3, z: 0 }, facing: 315, onRevive: { use: ashes_to_ashes, after: 15000 } }
  # 苏生之羽刷出的羽毛（两种布局之一）
  feather_1: { type: mob, model: feather, group: feathers, hp: 3000, attack: 1, speed: 0, size: 0.6, visible: false, targetable: false, autoAttackRange: 0 }
  feather_2: { type: mob, model: feather, group: feathers, hp: 3000, attack: 1, speed: 0, size: 0.6, visible: false, targetable: false, autoAttackRange: 0 }
  feather_3: { type: mob, model: feather, group: feathers, hp: 3000, attack: 1, speed: 0, size: 0.6, visible: false, targetable: false, autoAttackRange: 0 }
  feather_4: { type: mob, model: feather, group: feathers, hp: 3000, attack: 1, speed: 0, size: 0.6, visible: false, targetable: false, autoAttackRange: 0 }

player:
  position: { x: 0, y: -12, z: 0 }

boss_ai:
  # 自动攻击按中心距离判定，需覆盖 4.5 的判定半径
  chaseRange: 7
  autoAttackRange: 9
  autoAttackInterval: 3000
  aggroRange: 10

local_buffs:
  suzaku_vuln:
    name: 受伤加重
    type: debuff
    stackable: true
    maxStacks: 8
    duration: 90000
    effects:
      - { type: vulnerability, value: 0.25 }
  keen_eye:
    name: 见切
    type: buff
    duration: 10000
    effects:
      - { type: damage_increase, value: 0.2 }
  opening:
    name: 破绽
    type: debuff
    duration: 10000
    effects:
      - { type: damage_increase, value: -0.2 }
  # 跳舞机：对准一拍给玩家叠，错过一拍给朱雀叠
  hymn_resonance:
    name: 伤害提高
    type: buff
    stackable: true
    maxStacks: 10
    duration: 180000
    effects:
      - { type: damage_increase, value: 0.1 }
  hymn_fervor:
    name: 灼热
    type: buff
    stackable: true
    maxStacks: 10
    duration: 600000
    preserveOnDeath: true
    effects:
      - { type: damage_increase, value: 0.15 }

skills:
  boss_auto:
    name: 攻击
    type: ability
    targetType: single
    requiresTarget: true
    range: 6
    effects:
      - { type: damage, potency: 900, when: { role: tank } }
      - { type: damage, potency: 300, when: { role: dps } }

  # --- 全屏 ---
  screams_tutorial:
    name: 叫唤地狱
    type: spell
    castTime: 3000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: none }
        shape: { type: circle, radius: 60 }
        telegraph: false
        resolveDelay: 3000
        hitEffectDuration: 400
        effects: [{ type: damage, potency: 1100 }]
  screams:
    name: 叫唤地狱
    type: spell
    castTime: 3000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: none }
        shape: { type: circle, radius: 60 }
        telegraph: false
        resolveDelay: 3000
        hitEffectDuration: 400
        effects: [{ type: damage, potency: 1800 }]

  # --- 猛进：从场边横穿全场 ---
  rout_tutorial:
    name: 猛进
    type: spell
    castTime: 4000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: caster_facing }
        shape: { type: rect, length: 55, width: 6 }
        resolveDelay: 4000
        hitEffectDuration: 400
        effects:
          - { type: damage, potency: 2300 }
          - { type: apply_buff, buffId: suzaku_vuln, target: target, when: { role: tank } }
  rout:
    name: 猛进
    type: spell
    castTime: 3000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: caster_facing }
        shape: { type: rect, length: 55, width: 6 }
        resolveDelay: 3000
        hitEffectDuration: 400
        effects:
          - { type: damage, potency: 3800 }
          - { type: apply_buff, buffId: suzaku_vuln, target: target, when: { role: tank } }

  # --- 苏生之炎：跟随玩家的分散圈，碰到火焰鸟尸体会复活它 ---
  rekindle:
    name: 苏生之炎
    type: ability
    targetType: single
    requiresTarget: true
    range: 99
    zones:
      - anchor: { type: target_live }
        direction: { type: none }
        shape: { type: circle, radius: 6 }
        marker: spread
        resolveDelay: 5000
        hitEffectDuration: 400
        effects:
          - { type: damage, potency: 800 }
          - { type: revive }

  # --- 翼宿击：朝玩家的 90° 扇形 ---
  fleeting_summer_tutorial:
    name: 翼宿击
    type: spell
    castTime: 4000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: toward_target }
        shape: { type: fan, radius: 40, angle: 90 }
        resolveDelay: 4000
        hitEffectDuration: 400
        effects:
          - { type: damage, potency: 2300 }
          - { type: apply_buff, buffId: suzaku_vuln, target: target, when: { role: tank } }
  fleeting_summer:
    name: 翼宿击
    type: spell
    castTime: 3000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: toward_target }
        shape: { type: fan, radius: 40, angle: 90 }
        resolveDelay: 3000
        hitEffectDuration: 400
        effects:
          - { type: damage, potency: 3800 }
          - { type: apply_buff, buffId: suzaku_vuln, target: target, when: { role: tank } }

  # --- 鬼宿脚：坦克吃死刑，DPS 拼刀（timeline 里的 blade_clash） ---
  phantom_flurry:
    name: 鬼宿脚
    type: spell
    castTime: 5000
    targetType: single
    requiresTarget: true
    range: 99
    zones:
      - anchor: { type: target_live }
        direction: { type: none }
        shape: { type: circle, radius: 1.2 }
        marker: buster
        resolveDelay: 5000
        hitEffectDuration: 200
        effects: []
    effects:
      - { type: damage, potency: 13000, when: { role: tank } }
  # 死刑后接的前方半场刀，方向锁定在读条开始时的朝向
  phantom_half_tutorial:
    name: 鬼宿脚
    type: spell
    castTime: 6000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: caster_facing }
        shape: { type: fan, radius: 41, angle: 180 }
        resolveDelay: 6000
        hitEffectDuration: 400
        effects:
          - { type: damage, potency: 2300 }
          - { type: knockback, distance: 8 }
          - { type: apply_buff, buffId: suzaku_vuln, target: target, when: { role: tank } }
  phantom_half:
    name: 鬼宿脚
    type: spell
    castTime: 4000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: caster_facing }
        shape: { type: fan, radius: 41, angle: 180 }
        resolveDelay: 4000
        hitEffectDuration: 400
        effects:
          - { type: damage, potency: 3800 }
          - { type: knockback, distance: 8 }
          - { type: apply_buff, buffId: suzaku_vuln, target: target, when: { role: tank } }

  # --- 小怪战 ---
  phoenix_down:
    name: 苏生之羽
    type: spell
    castTime: 3000
    targetType: aoe
  feather_rebirth:
    name: 苏生神通力
    type: spell
    castTime: 20000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: none }
        shape: { type: circle, radius: 9 }
        resolveDelay: 20000
        telegraphBefore: 8000
        hitEffectDuration: 400
        effects:
          - { type: damage, potency: 1500 }
          - { type: revive }
  ashes_to_ashes:
    name: 升天
    type: spell
    castTime: 3000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: none }
        shape: { type: circle, radius: 60 }
        telegraph: false
        resolveDelay: 3000
        hitEffectDuration: 400
        effects: [{ type: damage, potency: 4200 }]

  # --- 跳舞机 → 燃烬天火 → 场地破碎 ---
  eternal_flame:
    name: 苏生大火
    type: spell
    castTime: 3000
    targetType: aoe
  scarlet_fever:
    name: 燃烬天火
    type: spell
    castTime: 7000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: none }
        shape: { type: circle, radius: 60 }
        telegraph: false
        resolveDelay: 7000
        hitEffectDuration: 400
        effects: [{ type: damage, potency: 1800 }]

  # --- P2 ---
  southron_star_tutorial:
    name: 星宿波
    type: spell
    castTime: 4000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: none }
        shape: { type: circle, radius: 60 }
        telegraph: false
        resolveDelay: 4000
        hitEffectDuration: 400
        effects: [{ type: damage, potency: 1100 }]
  southron_star:
    name: 星宿波
    type: spell
    castTime: 4000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: none }
        shape: { type: circle, radius: 60 }
        telegraph: false
        resolveDelay: 4000
        hitEffectDuration: 400
        effects: [{ type: damage, potency: 1800 }]
  # 引诱旋律：吸引向中心洞（站外沿）；拒绝旋律：击退（站内沿）
  mesmerizing_melody_tutorial:
    name: 引诱旋律
    type: spell
    castTime: 5000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: none }
        shape: { type: circle, radius: 60 }
        telegraph: false
        marker: pull
        resolveDelay: 5000
        hitEffectDuration: 300
        effects: [{ type: pull, distance: 9 }]
  mesmerizing_melody:
    name: 引诱旋律
    type: spell
    castTime: 4000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: none }
        shape: { type: circle, radius: 60 }
        telegraph: false
        marker: pull
        resolveDelay: 4000
        hitEffectDuration: 300
        effects: [{ type: pull, distance: 9 }]
  ruthless_refrain_tutorial:
    name: 拒绝旋律
    type: spell
    castTime: 5000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: none }
        shape: { type: circle, radius: 60 }
        telegraph: false
        marker: knockback
        resolveDelay: 5000
        hitEffectDuration: 300
        effects: [{ type: knockback, distance: 9 }]
  ruthless_refrain:
    name: 拒绝旋律
    type: spell
    castTime: 4000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: none }
        shape: { type: circle, radius: 60 }
        telegraph: false
        marker: knockback
        resolveDelay: 4000
        hitEffectDuration: 300
        effects: [{ type: knockback, distance: 9 }]
  # 井宿焰：朝玩家的超宽直线
  well_of_flame_tutorial:
    name: 井宿焰
    type: spell
    castTime: 5000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: toward_target }
        shape: { type: rect, length: 41, width: 20 }
        resolveDelay: 5000
        hitEffectDuration: 400
        effects:
          - { type: damage, potency: 2300 }
          - { type: apply_buff, buffId: suzaku_vuln, target: target, when: { role: tank } }
  well_of_flame:
    name: 井宿焰
    type: spell
    castTime: 4000
    targetType: aoe
    zones:
      - anchor: { type: caster }
        direction: { type: toward_target }
        shape: { type: rect, length: 41, width: 20 }
        resolveDelay: 4000
        hitEffectDuration: 400
        effects:
          - { type: damage, potency: 3800 }
          - { type: apply_buff, buffId: suzaku_vuln, target: target, when: { role: tank } }

phases:
  phase_default:
    actions:
      # ===== P1（教学） =====
      - { at: 0, action: enable_ai }
      - { at: 6000, use: screams_tutorial }

      # 猛进：朱雀离场，从场边随机一处出现并横穿全场；同时玩家头顶分散圈
      - { at: 11000, action: disable_ai }
      - { at: 11000, action: set_visible, value: false }
      - { at: 11000, action: set_targetable, value: false }
      - at: 11500
        choose:
          - [{ action: teleport, position: { x: -20, y: 0 } }, { action: lock_facing, facing: 90 }]
          - [{ action: teleport, position: { x: 20, y: 0 } }, { action: lock_facing, facing: 270 }]
          - [{ action: teleport, position: { x: 0, y: 20 } }, { action: lock_facing, facing: 180 }]
          - [{ action: teleport, position: { x: 0, y: -20 } }, { action: lock_facing, facing: 0 }]
      - { at: 12500, action: set_visible, value: true }
      - { at: 12600, use: rout_tutorial }
      - { at: 13500, use: rekindle, entity: helper }
      - { at: 18500, action: set_visible, value: false }
      - { at: 19000, action: teleport, position: { x: 0, y: 6 } }
      - { at: 19800, action: set_visible, value: true }
      - { at: 19800, action: set_targetable, value: true }
      - { at: 20000, action: enable_ai }

      - { at: 24000, use: fleeting_summer_tutorial }

      # 鬼宿脚：死刑（坦克开减伤 / DPS 拼刀）→ 前方半场刀
      - { at: 32000, use: phantom_flurry }
      - { at: 32000, mechanic: blade_clash, when: { role: dps }, params: { windup: 5000, skillName: 鬼宿脚, goodPotency: 1900, missPotency: 7500, justBuff: keen_eye, missBuff: opening } }
      - { at: 37500, use: phantom_half_tutorial }

      # ===== 小怪战 =====
      - { at: 46000, use: screams }
      - { at: 51000, action: disable_ai }
      - { at: 51000, action: teleport, position: { x: 0, y: 6 } }
      - { at: 51500, use: phoenix_down }
      - at: 54500
        choose:
          - # 正点
            - { action: teleport, entity: feather_1, position: { x: 0, y: 11 } }
            - { action: teleport, entity: feather_2, position: { x: 11, y: 0 } }
            - { action: teleport, entity: feather_3, position: { x: 0, y: -11 } }
            - { action: teleport, entity: feather_4, position: { x: -11, y: 0 } }
          - # 斜点
            - { action: teleport, entity: feather_1, position: { x: 7.8, y: 7.8 } }
            - { action: teleport, entity: feather_2, position: { x: 7.8, y: -7.8 } }
            - { action: teleport, entity: feather_3, position: { x: -7.8, y: -7.8 } }
            - { action: teleport, entity: feather_4, position: { x: -7.8, y: 7.8 } }
      - { at: 55000, action: set_visible, entity: feather_1, value: true }
      - { at: 55000, action: set_visible, entity: feather_2, value: true }
      - { at: 55000, action: set_visible, entity: feather_3, value: true }
      - { at: 55000, action: set_visible, entity: feather_4, value: true }
      - { at: 55000, action: set_targetable, entity: feather_1, value: true }
      - { at: 55000, action: set_targetable, entity: feather_2, value: true }
      - { at: 55000, action: set_targetable, entity: feather_3, value: true }
      - { at: 55000, action: set_targetable, entity: feather_4, value: true }
      - { at: 55200, use: feather_rebirth, entity: feather_1 }
      - { at: 55200, use: feather_rebirth, entity: feather_2 }
      - { at: 55200, use: feather_rebirth, entity: feather_3 }
      - { at: 55200, use: feather_rebirth, entity: feather_4 }
      - { at: 61000, use: rekindle, entity: helper }
      - { at: 84000, use: screams }
      - { at: 91000, action: enable_ai }

      # ===== 跳舞机（苏生大火） =====
      - { at: 95000, action: disable_ai }
      - { at: 95000, action: set_targetable, value: false }
      - { at: 95000, use: eternal_flame }
      - { at: 98000, mechanic: move_along, params: { entity: boss, path: [{ x: 0, y: 14 }, { x: 0, y: 34 }], duration: 2200 } }
      - { at: 100200, action: set_visible, value: false }
      - { at: 100500, action: show_dialog, text: 站进光圈。光球落下的瞬间，面朝箭头方向（朝哪个方向移动就面朝哪里）。 }
      - { at: 100500, mechanic: dance, params: { center: { x: 0, y: -6 }, radius: 2.5, lead: 1800, successBuff: hymn_resonance, failBuff: hymn_fervor, beats: [7000, 8100, 9200, 16900, 19000, 20100, 21200, 23400, 25500, 26700] } }
      - { at: 112000, action: hide_dialog }

      # ===== 燃烬天火 → 场地破碎为环形 =====
      - { at: 128000, action: teleport, position: { x: 0, y: 20 } }
      - { at: 128400, action: set_visible, value: true }
      - { at: 128400, mechanic: move_along, params: { entity: boss, path: [{ x: 0, y: 0 }], duration: 1600, faceTravel: false } }
      - { at: 128400, action: lock_facing, facing: 180 }
      - { at: 130000, use: scarlet_fever }
      - { at: 137000, mechanic: arena_ring, params: { inner: 5.5 } }
      - at: 137000
        action: run_script
        script: |
          (ctx) => {
            // 场地破碎时，没复活的火焰鸟尸体随碎片坠落
            for (const id of ['bird_1', 'bird_2', 'bird_3', 'bird_4']) {
              const e = ctx.getEntity(id)
              if (e && e.dormant) { e.dormant = false; e.visible = false; e.targetable = false }
            }
          }
      - { at: 138000, action: set_targetable, value: true }
      - { at: 138000, action: set_speed, speed: 0 }
      - { at: 138000, action: enable_ai }

      # ===== P2（教学） =====
      - { at: 142000, use: southron_star_tutorial }
      - { at: 149000, use: mesmerizing_melody_tutorial }
      - { at: 158000, use: well_of_flame_tutorial }
      - { at: 158000, use: rekindle, entity: helper }
      - { at: 168000, use: phantom_flurry }
      - { at: 168000, mechanic: blade_clash, when: { role: dps }, params: { windup: 5000, skillName: 鬼宿脚, goodPotency: 1900, missPotency: 7500, justBuff: keen_eye, missBuff: opening } }
      - { at: 173500, use: phantom_half }
      - { at: 182000, use: ruthless_refrain_tutorial }
      - { at: 191000, use: southron_star }

      # ===== 组合段（鸳鸯锅与傀儡旋律实装前的循环） =====
      - at: 197000
        choose:
          - [{ use: ruthless_refrain }]
          - [{ use: mesmerizing_melody }]
      - { at: 203000, use: well_of_flame }
      - { at: 203000, use: rekindle, entity: helper }
      - { at: 210000, use: phantom_flurry }
      - { at: 210000, mechanic: blade_clash, when: { role: dps }, params: { windup: 5000, skillName: 鬼宿脚, goodPotency: 1900, missPotency: 7500, justBuff: keen_eye, missBuff: opening } }
      - { at: 215500, use: phantom_half }
      - at: 219800
        choose:
          - [{ use: ruthless_refrain }]
          - [{ use: mesmerizing_melody }]
      - { at: 228000, use: southron_star }
      - { at: 234000, loop: 197000 }
