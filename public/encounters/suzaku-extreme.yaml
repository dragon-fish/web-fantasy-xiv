  piper_e: { name: 傀儡旋律：东, icon: https://r2.epb.wiki/ffxiv/effects/015933_hr1.png, description: 倒计时结束后被强制向东移动。, type: debuff, duration: 9000, effects: [] }
  piper_s: { name: 傀儡旋律：南, icon: https://r2.epb.wiki/ffxiv/effects/015933_hr1.png, description: 倒计时结束后被强制向南移动。, type: debuff, duration: 9000, effects: [] }
  piper_w: { name: 傀儡旋律：西, icon: https://r2.epb.wiki/ffxiv/effects/015933_hr1.png, description: 倒计时结束后被强制向西移动。, type: debuff, duration: 9000, effects: [] }
  piper_march:
    name: 强制移动
    icon: https://r2.epb.wiki/ffxiv/effects/015773_hr1.png
